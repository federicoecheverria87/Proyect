<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Store</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Load Stylesheet-->
    <link rel="stylesheet" href="../Css/Colors.css">
    <link rel="stylesheet" href="../Css/Styles.css">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../Assets/logo.ico">

</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-md bg-dark navbar-dark navbar-ts">
            <div class="container">
                <a class="navbar-brand" href="../Index.html">
                    <img src="../Assets/logo.ico" alt="Logo" width="70" height="70"
                        class="d-inline-block align-text-center pointer">
                    <span class="text-secondary-color">TECH STORE</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link text-secondary-color" href="Home.html">Inicio</a>
                        <a id="logout" class="nav-link text-secondary-color" href="Login.html">Log out</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section id="home" class="py-5 container mt-4 container-ts bg-black rounded-3 shadow-lg">
            <h2 id="form-title" class="text-center mb-4 text-tertiary-color">
                Nuevo producto
            </h2>

            <form id="form-product" class="container g-4" novalidate>
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-6">
                        <div class="mb-3">
                            <label for="name" class="form-label text-primary-color">Nombre</label>
                            <input type="text" class="form-control" id="name" name="name" maxlength="100" required>
                            <div class="invalid-feedback">El nombre es obligatorio.</div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label text-primary-color">Descripción</label>
                            <textarea class="form-control" id="description" name="description" rows="3" maxlength="255" required></textarea>
                            <div class="invalid-feedback">La descripción es obligatoria.</div>
                        </div>

                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <label for="price" class="form-label text-primary-color">Precio</label>
                                <input type="number" class="form-control" id="price" name="price" min="0.01" step="0.01" required>
                                <div class="invalid-feedback">Ingresá un precio mayor a cero.</div>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label for="stock" class="form-label text-primary-color">Stock</label>
                                <input type="number" class="form-control" id="stock" name="stock" min="0" step="1" required>
                                <div class="invalid-feedback">Ingresá un stock entero no negativo.</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="categoryId" class="form-label text-primary-color">Categoría</label>
                            <select class="form-select" id="categoryId" name="categoryId" required>
                                <option value="">Seleccioná una categoría</option>
                            </select>
                            <div class="invalid-feedback">Seleccioná una categoría.</div>
                        </div>

                        <div class="mb-3">
                            <label for="image" class="form-label text-primary-color">Imagen</label>
                            <input type="file" class="form-control" id="image" name="image" accept="image/*">
                            <div id="image-help" class="form-text text-white">
                                La imagen es obligatoria al crear un producto.
                            </div>
                            <img id="image-preview" class="img-fluid rounded mt-3 d-none" alt="Vista previa de la imagen del producto">
                        </div>

                        <div class="d-flex gap-2">
                            <button id="submit-product" type="submit" class="btn btn-primary">Guardar</button>
                            <a class="btn btn-secondary" href="Home.html">Cancelar</a>
                        </div>
                    </div>
                </div>
            </form>

        </section>

    </main>

    <footer class="bg-dark text-white text-center p-3 mt-auto">
        <div class=" container">
            <p class="mb-0">Tech Store - 2026</p>
        </div>
    </footer>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script type="module" src="../JavaScript/pages/product.js"></script>
</body>

</html>
