<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del producto | Tech Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../Css/Colors.css">
    <link rel="stylesheet" href="../Css/Styles.css">
    <link rel="icon" type="image/x-icon" href="../Assets/logo.ico">
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-md bg-dark navbar-dark navbar-ts">
            <div class="container">
                <a class="navbar-brand" href="../Index.html">
                    <img src="../Assets/logo.ico" alt="Logo" width="70" height="70"
                        class="d-inline-block align-text-center pointer">
                    <span class="text-secondary-color">TECH STORE</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link text-secondary-color" href="Home.html">Inicio</a>
                        <a id="logout" class="nav-link text-secondary-color" href="Login.html">Log out</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow-1">
        <section class="py-5 container mt-4 container-ts bg-black rounded-3 shadow-lg">
            <h1 class="text-center mb-4 text-tertiary-color">Detalle del producto</h1>

            <div id="product-detail" class="row g-4 align-items-center" aria-live="polite">
                <div class="col-12 text-center text-white">
                    <p>Cargando producto...</p>
                </div>
            </div>

            <div class="text-center mt-4">
                <a class="btn btn-secondary" href="Home.html">
                    <i class="fa-solid fa-arrow-left me-1" aria-hidden="true"></i>
                    Volver a productos
                </a>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-auto">
        <div class="container">
            <p class="mb-0">Tech Store - 2026</p>
        </div>
    </footer>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="../JavaScript/pages/product-detail.js"></script>
</body>

</html>
