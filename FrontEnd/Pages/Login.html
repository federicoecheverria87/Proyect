<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Store</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Load Stylesheet-->
    <link rel="stylesheet" href="../Css/Colors.css">
    <link rel="stylesheet" href="../Css/Styles.css">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../Assets/logo.ico">

</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-md bg-dark navbar-dark navbar-ts">
            <div class="container">
                <a class="navbar-brand" href="../Index.html">
                    <img src="../Assets/logo.ico" alt="Logo" width="70" height="70"
                        class="d-inline-block align-text-center pointer">
                    <span class="text-primary-color">TECH STORE</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link text-primary-color" href="Register.html">Registro</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>


    <main class="container py-5">
        <div class="row justify-content-center bg-dark p-4 rounded-3">
            <div class="col-12 col-md-6 col-lg-4">

                <h1 class="h3 mb-4 text-tertiary-color">Iniciar sesión</h1>

                <form id="form-login">

                    <div class="mb-3">
                        <label for="email" class="form-label text-primary-color">Email</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label text-primary-color">Contraseña</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Iniciar sesión
                    </button>
                </form>

                <p id="mensaje-login" class="mt-3"></p>

                <a href="../Index.html" class="text-secondary-color">Volver al inicio</a>
            </div>
        </div>
    </main>
    
    <footer class="bg-dark text-white text-center p-3 mt-auto">
        <div class=" container">
            <p class="mb-0">Tech Store - 2026</p>
        </div>
    </footer>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    
    <script type="module" src="../JavaScript/pages/login.js"></script>

</body>

</html>
