<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Tech Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../Css/Colors.css">
    <link rel="stylesheet" href="../Css/Styles.css">
    <link rel="icon" type="image/x-icon" href="../Assets/logo.ico">
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-md bg-dark navbar-dark navbar-ts">
            <div class="container">
                <a class="navbar-brand" href="../Index.html">
                    <img src="../Assets/logo.ico" alt="Logo" width="70" height="70"
                        class="d-inline-block align-text-center pointer">
                    <span class="text-primary-color">TECH STORE</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link text-primary-color" href="../Index.html">Inicio</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 bg-dark p-4 p-md-5 rounded-3 shadow-lg">
                <h1 class="h3 mb-4 text-tertiary-color text-center">Crear cuenta</h1>

                <form id="form-register" novalidate>
                    <div class="mb-3">
                        <label for="name" class="form-label text-primary-color">Nombre</label>
                        <input type="text" id="name" name="name" class="form-control" maxlength="100" required>
                        <div class="invalid-feedback">Ingresá tu nombre.</div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label text-primary-color">Email</label>
                        <input type="email" id="email" name="email" class="form-control" autocomplete="email" required>
                        <div class="invalid-feedback">Ingresá un correo electrónico válido.</div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label text-primary-color">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control"
                            autocomplete="new-password" required>
                        <div class="invalid-feedback">Ingresá una contraseña.</div>
                    </div>

                    <div class="mb-3">
                        <label for="confirm-password" class="form-label text-primary-color">Confirmar contraseña</label>
                        <input type="password" id="confirm-password" class="form-control"
                            autocomplete="new-password" required>
                        <div class="invalid-feedback">Las contraseñas deben coincidir.</div>
                    </div>

                    <div class="mb-4">
                        <label for="photo" class="form-label text-primary-color">Foto de perfil</label>
                        <input type="file" id="photo" name="photo" class="form-control" accept="image/*" required>
                        <div class="form-text text-white">La foto es obligatoria para crear la cuenta.</div>
                        <div class="invalid-feedback">Seleccioná una foto de perfil.</div>
                    </div>

                    <button id="submit-register" type="submit" class="btn btn-primary w-100">
                        Crear cuenta
                    </button>
                </form>

                <p class="mt-4 mb-0 text-center text-white">
                    ¿Ya tenés una cuenta?
                    <a href="Login.html" class="text-secondary-color">Iniciá sesión</a>
                </p>
                <p class="mt-3 mb-0 text-center">
                    <a href="../Index.html" class="text-secondary-color">Volver al inicio</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-auto">
        <div class="container">
            <p class="mb-0">Tech Store - 2026</p>
        </div>
    </footer>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="../JavaScript/pages/register.js"></script>
</body>

</html>
