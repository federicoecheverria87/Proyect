<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar categorías | Tech Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../Css/Colors.css">
    <link rel="stylesheet" href="../Css/Styles.css">
    <link rel="icon" type="image/x-icon" href="../Assets/logo.ico">
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-md bg-dark navbar-dark navbar-ts">
            <div class="container">
                <a class="navbar-brand" href="../Index.html">
                    <img src="../Assets/logo.ico" alt="Logo" width="70" height="70"
                        class="d-inline-block align-text-center pointer">
                    <span class="text-secondary-color">TECH STORE</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link text-secondary-color" href="Home.html">Inicio</a>
                        <a id="logout" class="nav-link text-tertiary-color" href="Login.html">Log out</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow-1">
        <section class="py-5 container mt-4 container-ts bg-black rounded-3 shadow-lg">
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3 mb-4">
                <h1 class="text-center text-tertiary-color mb-0">Administrar categorías</h1>
                <button id="add-category" type="button" class="btn btn-primary">
                    <i class="fa-solid fa-plus me-1" aria-hidden="true"></i>
                    Nueva categoría
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-dark table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th scope="col" class="text-primary-color">ID</th>
                            <th scope="col" class="text-primary-color">Nombre</th>
                            <th scope="col" class="text-primary-color">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="categories-list"></tbody>
                </table>
            </div>
            <p id="empty-categories" class="text-center text-white d-none" aria-live="polite"></p>
        </section>
    </main>

    <div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white">
                <form id="form-category" novalidate>
                    <div class="modal-header">
                        <h2 class="modal-title fs-5 text-tertiary-color" id="categoryModalLabel">Crear categoría</h2>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div id="category-error" class="alert alert-danger d-none" role="alert"></div>
                        <div>
                            <label for="category-name" class="form-label text-primary-color">Nombre</label>
                            <input id="category-name" name="name" class="form-control" maxlength="100" required>
                            <div class="invalid-feedback">Ingresá el nombre de la categoría.</div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button id="save-category" type="submit" class="btn btn-primary">Crear</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteCategoryModal" tabindex="-1" aria-labelledby="deleteCategoryModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header">
                    <h2 class="modal-title fs-5 text-tertiary-color" id="deleteCategoryModalLabel">
                        Confirmar eliminación
                    </h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p>¿Querés eliminar esta categoría?</p>
                    <p id="delete-category-name" class="text-primary-color mb-0"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button id="confirm-delete-category" type="button" class="btn btn-danger">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center p-3 mt-auto">
        <div class="container">
            <p class="mb-0">Tech Store - 2026</p>
        </div>
    </footer>

    <div id="toast" class="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="../JavaScript/pages/categories.js"></script>
</body>

</html>
